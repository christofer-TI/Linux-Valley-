# ETAPA 1 - BLOQUEIO DE DOMINIOS

acl cliente_permitido src 192.168.1.3
acl sites_bloqueados dstdomain .youtube.com .youtu.be
http_access deny sites_bloqueados
http_access allow cliente_permitido

###
# ETAPA 2 - LISTA DE PERMISSOES (ALLOWLIST)

acl cliente_permitido src 192.168.1.3
acl sites_permitidos dstdomain .google.com .github.com
http_access allow cliente_permitido sites_permitidos

###
# Carregamento de configuracoes adicionais
include /etc/squid/conf.d/*.conf
