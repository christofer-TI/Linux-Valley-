<VirtualHost *:80>
    ServerName linux-valley.local
    DocumentRoot /var/www/linux-valley

    <Directory /var/www/linux-valley>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/linux-valley-error.log
    CustomLog ${APACHE_LOG_DIR}/linux-valley-access.log combined
</VirtualHost>
